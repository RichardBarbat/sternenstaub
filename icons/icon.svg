<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sternenstaub: Schwarzes Loch mit Akkretionsscheibe und Lichtbogen -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#2a1150"/>
      <stop offset=".55" stop-color="#11062a"/>
      <stop offset="1" stop-color="#05020e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".25" stop-color="#ff9a3c" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff4f7a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff4f7a" stop-opacity="0"/>
    </radialGradient>
    <!-- Scheibe: innen weißglühend, außen dunkelrot; links (auf uns zu) heller -->
    <radialGradient id="diskR" cx="0" cy="0" r="230" gradientUnits="userSpaceOnUse">
      <stop offset=".46" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset=".72" stop-color="#ff8a34"/>
      <stop offset=".9" stop-color="#c2361c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7a1a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dopp" x1="-230" x2="230" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <mask id="dm" maskUnits="userSpaceOnUse" x="-300" y="-300" width="600" height="600"><rect x="-300" y="-300" width="600" height="600" fill="url(#dopp)"/></mask>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".6" stop-color="#fff6dc"/>
      <stop offset=".7" stop-color="#ffc061" stop-opacity=".9"/>
      <stop offset=".84" stop-color="#ff7a34" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haloFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".38"/>
    </linearGradient>
    <mask id="hm"><rect width="512" height="512" fill="url(#haloFade)"/></mask>
    <clipPath id="top" clipPathUnits="userSpaceOnUse"><rect x="-300" y="-300" width="600" height="302"/></clipPath>
    <clipPath id="bot" clipPathUnits="userSpaceOnUse"><rect x="-300" y="-2" width="600" height="302"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="80" cy="96" r="2.6" opacity=".85"/><circle cx="428" cy="84" r="2.2" opacity=".8"/>
    <circle cx="446" cy="404" r="2.6" opacity=".7"/><circle cx="66" cy="418" r="2" opacity=".7"/>
    <circle cx="160" cy="58" r="1.6" opacity=".6"/><circle cx="356" cy="458" r="1.8" opacity=".6"/>
    <path d="M410 150 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5z" opacity=".9"/>
    <path d="M104 336 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".8"/>
  </g>
  <circle cx="256" cy="268" r="240" fill="url(#glow)"/>
  <!-- hintere Scheibe (flach gedrückter Ring) -->
  <g transform="translate(256 268) rotate(-9) scale(1 .23)">
    <g clip-path="url(#top)" mask="url(#dm)"><circle r="230" fill="url(#diskR)"/></g>
  </g>
  <!-- Lichtbogen: das Bild der hinteren Scheibe um den Schatten gebogen -->
  <circle cx="256" cy="268" r="168" fill="url(#halo)" mask="url(#hm)"/>
  <!-- Schatten & Photonenring -->
  <circle cx="256" cy="268" r="100" fill="#000"/>
  <circle cx="256" cy="268" r="102" fill="none" stroke="#fff7e6" stroke-width="3.5" opacity=".95"/>
  <!-- vordere Scheibe -->
  <g transform="translate(256 268) rotate(-9) scale(1 .23)">
    <g clip-path="url(#bot)" mask="url(#dm)"><circle r="230" fill="url(#diskR)"/></g>
  </g>
</svg>
