<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Singularität">
<meta name="theme-color" content="#07051a">
<meta name="format-detection" content="telephone=no">
<title>Singularität</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=3.5">
</head>
<body>
<canvas id="sky"></canvas>

<div id="app">
  <header id="hud">
    <div class="amount"><span class="di">✦</span><span id="dust">0</span></div>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2 4.5 13.4h6.1L9.6 22l8.9-11.6h-6.2L13.2 2z"/></svg><span><b id="rate">0</b>/s</span></span>
      <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 13.68 7.93 17.8 6.2 16.07 10.32 23 12 16.07 13.68 17.8 17.8 13.68 16.07 12 23 10.32 16.07 6.2 17.8 7.93 13.68 1 12 7.93 10.32 6.2 6.2 10.32 7.93Z"/></svg><span><b id="tapv">1</b> pro Tipp</span></span>
    </div>
    <div id="hunger" aria-hidden="true"><i id="hungerFill"></i><span id="hungerTxt"></span></div>
    <div id="buffs"></div>
  </header>

  <section id="stage" aria-label="Tippe auf das Schwarze Loch">
    <div id="toasts"></div>
    <button id="capBtn" hidden aria-label="Kapseln öffnen"><img id="capImg" alt=""><b id="capN">0</b></button>
    <div id="abil"></div>
    <div id="event" class="glass" hidden><div id="eventTxt"></div><i class="eb"><b id="eventBar"></b></i></div>
    <div id="growth" aria-hidden="true"><span id="gname"></span><i><b id="gbar"></b></i></div>
    <div id="hint">Tippe auf das Schwarze Loch</div>
  </section>

  <main id="panel">
    <button id="grab" aria-label="Menü ausblenden"></button>
    <div class="phead">
      <h2 id="ptitle">Orbit</h2>
      <div class="seg" id="seg" role="group" aria-label="Kaufmenge">
        <i class="seg-thumb"></i>
        <button data-amt="1">×1</button><button data-amt="10">×10</button><button data-amt="100">×100</button><button data-amt="r10" aria-label="Bis zur nächsten Zehnerzahl">Rund</button><button data-amt="max">Max</button>
      </div>
    </div>
    <div id="list"></div>
  </main>

  <nav id="tabs" class="glass" aria-label="Bereiche">
    <i class="tab-pill"></i>
    <button data-tab="gens">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="mPlanet" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M2.64 16.98A10.6 3.7 -28 0 0 21.36 7.02" fill="none" stroke="#000" stroke-width="4.2"/></mask></defs>
        <circle cx="12" cy="12" r="6.4" mask="url(#mPlanet)"/>
        <ellipse cx="12" cy="12" rx="10.6" ry="3.7" transform="rotate(-28 12 12)" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg><span>Orbit</span></button>
    <button data-tab="ups">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2 4.5 13.4h6.1L9.6 22l8.9-11.6h-6.2L13.2 2z"/></svg><span>Upgrades</span><i class="dot" id="dotUp"></i></button>
    <button data-tab="ach">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5.3a5 5 0 0 1-10 0V3z"/><path d="M7 5.2H4.4v1.4a3.4 3.4 0 0 0 3.3 3.4M17 5.2h2.6v1.4a3.4 3.4 0 0 1-3.3 3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.8 13h2.4v3.6h-2.4z"/><rect x="7.2" y="16.6" width="9.6" height="3.6" rx="1.2"/></svg><span>Ziele</span><i class="dot" id="dotAch"></i></button>
    <button data-tab="nova">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 13.68 7.93 17.8 6.2 16.07 10.32 23 12 16.07 13.68 17.8 17.8 13.68 16.07 12 23 10.32 16.07 6.2 17.8 7.93 13.68 1 12 7.93 10.32 6.2 6.2 10.32 7.93Z"/></svg><span>Urknall</span><i class="dot" id="dotNova"></i></button>
    <button data-tab="more">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19.86 10.05L22.49 10.51L22.49 13.49L19.86 13.95L18.94 16.18L20.48 18.36L18.36 20.48L16.18 18.94L13.95 19.86L13.49 22.49L10.51 22.49L10.05 19.86L7.82 18.94L5.64 20.48L3.52 18.36L5.06 16.18L4.14 13.95L1.51 13.49L1.51 10.51L4.14 10.05L5.06 7.82L3.52 5.64L5.64 3.52L7.82 5.06L10.05 4.14L10.51 1.51L13.49 1.51L13.95 4.14L16.18 5.06L18.36 3.52L20.48 5.64L18.94 7.82ZM15.4 12a3.4 3.4 0 1 0-6.8 0 3.4 3.4 0 0 0 6.8 0Z"/></svg><span>Mehr</span></button>
  </nav>
</div>

<div id="glow" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="modal" hidden><div class="sheet glass" id="sheet"></div></div>
<label id="hapLabel" hidden><input type="checkbox" switch></label>

<script src="js/data.js?v=3.5"></script>
<script src="js/fx.js?v=3.5"></script>
<script src="js/action.js?v=3.5"></script>
<script src="js/game.js?v=3.5"></script>
</body>
</html>
